<div class="header-actions" aria-label="App controls">
  <button id="app-refresh" type="button">Refresh</button>
  <button id="app-export" type="button">Export HTML</button>
  <button id="app-settings" type="button">Settings</button>
  <button id="app-quit" type="button">Quit</button>
</div>
<dialog id="settings-dialog" aria-labelledby="settings-heading">
  <div class="settings-head"><h2 id="settings-heading">Settings</h2><button id="settings-close" class="secondary" type="button">Close</button></div>
  <div class="settings-content">
    <div id="settings-diagnostics" class="error"></div>
    <div class="settings-grid">
      <label>From<input id="setting-from" type="date"></label>
      <label>To<input id="setting-to" type="date"></label>
      <div class="timezone-setting"><label for="setting-timezone">Timezone</label><input id="setting-timezone-search" type="search" placeholder="Find a city or region" aria-label="Search timezones"><select id="setting-timezone" required></select><span id="setting-timezone-count" class="small"></span></div>
      <label>Default window (days)<input id="setting-window" type="number" min="1"></label>
    </div>
    <section class="settings-section"><h3>Collections and paper types</h3>
      <div class="settings-grid"><div><div class="field-label">Included collections</div><p class="small">Checking a collection includes all its descendants. Unchecking one collection leaves its descendants as they are.</p><div id="setting-collections" class="collection-picker"></div></div><div><div class="field-label">Paper types</div><div id="setting-types" class="settings-list"></div><label class="unfiled-setting"><input id="setting-unfiled" type="checkbox"> Include unfiled papers</label></div></div>
    </section>
    <section class="settings-section"><h3>Reading-status tags</h3><div id="setting-statuses" class="settings-grid"></div></section>
    <section class="settings-section"><h3>Annotation colours</h3><div id="setting-colors"></div><button id="add-color" class="secondary" type="button">Add colour</button></section>
    <section class="settings-section"><h3>Tag categories</h3><div id="setting-categories"></div><button id="add-category" class="secondary" type="button">Add category</button></section>
    <div id="settings-error" class="error" role="alert"></div>
    <div class="settings-actions"><button id="settings-cancel" class="secondary" type="button">Cancel</button><button id="settings-save" class="primary" type="button">Save settings</button></div>
  </div>
</dialog>
