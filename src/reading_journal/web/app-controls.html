<div class="header-actions" aria-label="App controls">
  <button id="app-refresh" type="button">Refresh</button>
  <button id="app-export" type="button">Export HTML</button>
  <button id="app-settings" type="button">Settings</button>
  <button id="app-quit" type="button">Quit</button>
</div>
<dialog id="settings-dialog" aria-labelledby="settings-heading">
  <div class="settings-head"><h2 id="settings-heading">Settings</h2><button id="settings-close" class="secondary" type="button">Close</button></div>
  <div class="settings-content">
    <div id="settings-diagnostics" class="error"></div>
    <section class="settings-section first-section"><div class="settings-section-head"><div><h3>Annotations</h3><p class="help">Colors, meanings, and descriptions.</p></div><button id="add-color" class="secondary" type="button">Add color</button></div><div id="setting-colors" class="editor-list"></div></section>
    <section class="settings-section"><div class="settings-section-head"><div><h3>Tags</h3><p class="help">Category colors and individual tag colors. Any tag can carry a reading meaning.</p></div><button id="add-category" class="secondary" type="button">Add category</button></div><div id="setting-categories" class="editor-list"></div></section>
    <section class="settings-section"><h3>Library scope</h3><div class="scope-grid"><section class="scope-panel"><h4>Collections</h4><div id="setting-collections" class="scope-list"></div></section><section class="scope-panel"><h4>Paper types</h4><div id="setting-types" class="scope-list"></div></section></div><label class="unfiled-setting"><input id="setting-unfiled" type="checkbox"> Include unfiled papers</label></section>
    <section class="settings-section"><h3>Paper overview and export</h3><label class="unfiled-setting"><input id="setting-abstracts" type="checkbox"> Include paper abstracts in the overview and HTML exports</label><p class="help">Off by default to keep reports smaller.</p></section>
    <section class="settings-section"><h3>Dates and timezone</h3>
    <div class="settings-grid">
      <label>From<input id="setting-from" type="date"></label>
      <label>To<input id="setting-to" type="date"></label>
      <label>Country or region<select id="setting-timezone-country" required></select></label>
      <label>City<select id="setting-timezone" required></select></label>
      <p id="setting-timezone-preview" class="timezone-preview small" aria-live="polite"></p>
      <label>Default window (days)<input id="setting-window" type="number" min="1"></label>
    </div>
    </section>
  </div>
  <div class="settings-footer"><div id="settings-error" class="error" role="alert"></div><div class="settings-actions"><button id="settings-cancel" class="secondary" type="button">Cancel</button><button id="settings-save" class="primary" type="button">Save settings</button></div></div>
</dialog>
